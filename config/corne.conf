# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Corne OLED Display avec écran d'état personnalisé (Nice OLED)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Activation et réglages du module Nice OLED
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_STATUS=y

# Fond noir (non inversé) pour économiser la batterie
CONFIG_NICE_OLED_WIDGET_INVERTED=n

# Dimensions pour affichage vertical optimisé Corne (32x128)
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Animation WPM : Chat Pixel Luna (dort au repos, se réveille et s'anime à la frappe)
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300

# Position du chat Luna (centré sur 128px, pleine largeur 32px)
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_X=52
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_Y=0

# Coordonnées des modules texte pour affichage vertical optimisé (sur batterie)
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=15
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=15
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=20
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=15
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=45
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=75

# Désactivation des indicateurs superflus pour préserver la clarté et l'énergie
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n

# Désactivation du Bongo Cat pour éviter les conflits de symboles
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n

# Pas de compteur WPM basique (chiffres) ni jauge superflue pour préserver la lisibilité et l'énergie
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Animation du chat sur la moitié périphérique (droite)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1500
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_Y=0

# Gestion de l'énergie : extinction écran après 30s d'inactivité
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Veille profonde après 15 min sur batterie (désactivée en USB)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Contrôle de l'alimentation externe (permet de couper l'écran)
CONFIG_ZMK_EXT_POWER=y

# Réglages Bluetooth : +8dBm TX power et 1M PHY pour un signal stable
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# Rapport de niveau de batterie
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Pilote I2C pour l'écran OLED SSD1306
CONFIG_I2C=y

# ZMK Studio : connexion directe déverrouillée
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_KEYBOARD_NAME="Corne OLED"